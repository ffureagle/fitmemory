<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Store — Heavyweight cotton tee</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f4f3ef; color: #111; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .brand { color: #666; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
      .price { font-size: 18px; margin: 12px 0 24px; }
      h2 { font-size: 15px; margin: 28px 0 10px; }
      table { border-collapse: collapse; width: 100%; background: #fff; }
      caption { text-align: left; font-weight: 600; padding: 8px 0; }
      th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: center; font-size: 14px; }
      th { background: #faf9f6; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Zara</p>
      <h1>Heavyweight cotton tee</h1>
      <p class="price">€25,95 · Regular fit</p>
      <p>Ağır gramajlı, düşük omuzlu pamuklu tişört. Model 186 cm boyunda ve M beden giyiyor.</p>

      <h2>Ürün ölçüleri</h2>
      <table>
        <caption>Beden tablosu (cm)</caption>
        <thead>
          <tr>
            <th>Beden</th>
            <th>Göğüs eni (cm)</th>
            <th>Omuz (cm)</th>
            <th>Uzunluk (cm)</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>XS</td><td>48</td><td>40</td><td>68</td></tr>
          <tr><td>S</td><td>50</td><td>42</td><td>70</td></tr>
          <tr><td>M</td><td>53</td><td>44</td><td>72</td></tr>
          <tr><td>L</td><td>56</td><td>46</td><td>74</td></tr>
          <tr><td>XL</td><td>59</td><td>48</td><td>76</td></tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
