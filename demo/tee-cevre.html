<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Store — Göğüs çevresi tablosu</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f4f3ef; color: #111; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .brand { color: #666; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
      .price { font-size: 18px; margin: 12px 0 24px; }
      h2 { font-size: 15px; margin: 28px 0 10px; }
      table { border-collapse: collapse; width: 100%; background: #fff; }
      caption { text-align: left; font-weight: 600; padding: 8px 0; }
      th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: center; font-size: 14px; }
      th { background: #faf9f6; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Bershka</p>
      <h1>Muscle fit tişört</h1>
      <p class="price">490,00 TL · Regular fit</p>
      <p>Markanın beden rehberi göğüs çevresi verir; yarım göğüs eni değil.</p>

      <h2>Beden rehberi</h2>
      <table>
        <caption>Vücut ölçüleri (cm)</caption>
        <thead>
          <tr>
            <th>Beden</th>
            <th>Göğüs çevresi (cm)</th>
            <th>Bel çevresi (cm)</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>S</td><td>90</td><td>74</td></tr>
          <tr><td>M</td><td>98</td><td>82</td></tr>
          <tr><td>L</td><td>106</td><td>90</td></tr>
          <tr><td>XL</td><td>114</td><td>98</td></tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
