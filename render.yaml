services:
  - type: web
    name: fitmemory-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: DB_PROVIDER
        value: postgres
      - key: ConnectionStrings__FitMemory
        sync: false
      - key: APP_ORIGINS
        value: https://mfurkangokbag.com.tr,https://www.mfurkangokbag.com.tr
      - key: AI_PROVIDER
        value: Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
